    const HARI_INDO = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

    function esc(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Konversi YYYY-MM-DD -> DD/MM/YYYY
    function isoToDmy(dateStr) {
      if (!dateStr) return '';
      const clean = String(dateStr).trim();
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(clean)) return clean;
      const p = clean.split('-');
      if (p.length === 3 && p[0].length === 4) {
        return p[2].padStart(2, '0') + '/' + p[1].padStart(2, '0') + '/' + p[0];
      }
      return clean;
    }

    // Konversi DD/MM/YYYY -> YYYY-MM-DD
    function dmyToIso(dateStr) {
      if (!dateStr) return '';
      const clean = String(dateStr).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(clean)) return clean;
      const p = clean.split('/');
      if (p.length === 3 && p[2].length === 4) {
        return p[2] + '-' + p[1].padStart(2, '0') + '-' + p[0].padStart(2, '0');
      }
      return clean;
    }

    function todayDmy() {
      const d = new Date();
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return dd + '/' + mm + '/' + yyyy;
    }

    window.maskDmy = function(el, previewId) {
      let v = el.value.replace(/[^0-9]/g, '').slice(0, 8);
      if (v.length >= 5) {
        el.value = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
      } else if (v.length >= 3) {
        el.value = v.slice(0, 2) + '/' + v.slice(2);
      } else {
        el.value = v;
      }
      if (previewId) {
        const prev = document.getElementById(previewId);
        if (prev) prev.textContent = '📅 ' + formatTanggalIndo(el.value);
      }
    };

    function formatTanggalIndo(dateStr) {
      if (!dateStr) return '-';
      const iso = dmyToIso(dateStr);
      const parts = String(iso).trim().split('-');
      if (parts.length === 3 && parts[0].length === 4) {
        const y = Number(parts[0]);
        const m = Number(parts[1]) - 1;
        const d = Number(parts[2]);
        const dt = new Date(y, m, d);
        if (!isNaN(dt.getTime())) {
          const dd = String(d).padStart(2, '0');
          const mm = String(m + 1).padStart(2, '0');
          return HARI_INDO[dt.getDay()] + ', ' + dd + '/' + mm + '/' + y;
        }
      }
      return dateStr;
    }

    function parseJadwalArray(val) {
      if (Array.isArray(val)) return val;
      if (!val) return [];
      return String(val).split(',').map(s => s.trim()).filter(Boolean);
    }

    function computeStats(vitals) {
      const sorted = (vitals || []).slice().sort((a, b) => String(dmyToIso(a.tanggal)).localeCompare(String(dmyToIso(b.tanggal))));
      const enriched = sorted.map((v, i) => {
        const pre = Number(v.bb_pre) || 0;
        const post = v.bb_post !== '' && v.bb_post !== null && v.bb_post !== undefined ? Number(v.bb_post) : null;
        const drop = (post !== null && pre > 0) ? Number((pre - post).toFixed(2)) : null;
        const prev = i > 0 ? sorted[i - 1] : null;
        const prevPost = prev && prev.bb_post !== '' && prev.bb_post !== null ? Number(prev.bb_post) : null;
        const idwg = (prevPost !== null && pre > 0) ? Number((pre - prevPost).toFixed(2)) : null;
        return Object.assign({}, v, { drop, idwg });
      });

      const latestMs = enriched.length ? new Date(dmyToIso(enriched[enriched.length - 1].tanggal)).getTime() : Date.now();
      const monthRows = enriched.filter(x => {
        const ms = new Date(dmyToIso(x.tanggal)).getTime();
        return !isNaN(ms) ? (latestMs - ms) <= (30 * 86400000) : true;
      });

      const validDrops = monthRows.filter(x => x.drop !== null);
      const avgDrop1M = validDrops.length ? (validDrops.reduce((s, x) => s + x.drop, 0) / validDrops.length).toFixed(2) : '0.00';

      const validIdwg = monthRows.filter(x => x.idwg !== null);
      const avgIdwg1M = validIdwg.length ? (validIdwg.reduce((s, x) => s + x.idwg, 0) / validIdwg.length).toFixed(2) : '0.00';

      return {
        reversed: enriched.slice().reverse(),
        latest: enriched.length ? enriched[enriched.length - 1] : null,
        avgDrop1M,
        avgIdwg1M,
        monthCount: monthRows.length
      };
    }

          <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200/80 space-y-2.5">
            <div class="flex items-center justify-between">
              <h4 class="text-xs font-bold uppercase tracking-wider text-slate-700">Riwayat BB &amp; Selisih Antar-HD</h4>
              <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">${stats.reversed.length} Sesi</span>
            </div>
            <div class="space-y-2">
              ${stats.reversed.map(v => {
                const idwgHtml = v.idwg !== null ? `<span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-sky-100 text-sky-800">Naik dari HD lalu: ${v.idwg > 0 ? '+' : ''}${v.idwg} kg</span>` : '';
                const dropHtml = v.drop !== null ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-teal-100 text-teal-800">Turun HD: -${v.drop} kg</span>` : `<span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-amber-100 text-amber-800">Sedang HD (Belum Post)</span>`;
                const ufDurHtml = (v.uf_liter || v.durasi_jam) ? `<div class="flex items-center gap-3 pt-1 border-t border-slate-200/60 text-[10px] text-slate-600"><span>💧 Target UF: <b class="text-sky-700">${v.uf_liter ? esc(v.uf_liter) + ' L' : '-'}</b></span><span>⏱️ Durasi HD: <b class="text-indigo-700">${v.durasi_jam ? esc(v.durasi_jam) + ' Jam' : '-'}</b></span></div>` : '';
                return `
                  <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200/80 space-y-1.5">
                    <div class="flex flex-wrap items-center justify-between gap-1 border-b border-slate-200/70 pb-1">
                      <span class="text-xs font-bold text-slate-800">📅 ${esc(formatTanggalIndo(v.tanggal))}</span>
                      <div class="flex flex-wrap gap-1">${idwgHtml}${dropHtml}</div>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-[11px]">
                      <div>
                        <span class="text-[10px] text-slate-400 block">Berat Badan (kg)</span>
                        <span class="font-semibold text-slate-700">Pre: <b>${esc(v.bb_pre)}</b> &rarr; Post: <b class="text-teal-700">${v.bb_post !== null && v.bb_post !== '' ? esc(v.bb_post) : '-'}</b></span>
                      </div>
                      <div>
                        <span class="text-[10px] text-slate-400 block">Tekanan Darah (mmHg)</span>
                        <span class="font-semibold text-slate-700">${esc(v.td_pre || '-')} &rarr; <b class="text-teal-700">${esc(v.td_post || '-')}</b></span>
                      </div>
                    </div>
                    ${ufDurHtml}
                  </div>
                `;
              }).join('') || '<p class="text-xs text-slate-400 text-center py-6">Belum ada riwayat parameter vital.</p>'}
            </div>
          </div>
        `;
      }

      // 4. TAB LAB & OBAT (FORMAT TANGGAL DD/MM/YYYY)
      else if (state.activeTab === 'lab') {
        content = `
          <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200/80 space-y-3">
            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-700">III. Parameter Laboratorium</h4>
            <form onsubmit="handleSaveItem(event, 'lab')" class="p-2.5 rounded-xl bg-teal-50/70 border border-teal-200 space-y-2">
              <div class="grid grid-cols-3 gap-1.5">
                <div>
                  <label class="block text-[9px] font-bold text-teal-900">Tanggal (DD/MM/YYYY)</label>
                  <input id="labBulan" type="text" inputmode="numeric" maxlength="10" placeholder="DD/MM/YYYY" oninput="maskDmy(this)" required value="${todayDmy()}" class="w-full px-1.5 py-1 rounded bg-white border border-teal-300 text-[11px] font-mono" />
                </div>
                <div>
                  <label class="block text-[9px] font-bold text-teal-900">Hb (g/dL)</label>
                  <input id="labHb" type="number" step="0.1" required placeholder="10.8" class="w-full px-2 py-1 rounded bg-white border border-teal-300 text-xs" />
                </div>
                <div>
                  <label class="block text-[9px] font-bold text-teal-900">Trombosit (AT)</label>
                  <input id="labAt" type="number" required placeholder="230000" class="w-full px-2 py-1 rounded bg-white border border-teal-300 text-xs" />
                </div>
              </div>
              <button type="submit" class="w-full py-1.5 rounded-lg bg-teal-600 text-white text-[11px] font-bold">+ Simpan Hasil Lab Saya</button>
            </form>
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="border-b border-slate-200 text-[10px] text-slate-500 uppercase">
                    <th class="py-1.5 px-2">Tanggal</th>
                    <th class="py-1.5 px-2">Hemoglobin (Hb)</th>
                    <th class="py-1.5 px-2">Trombosit (AT)</th>
                  </tr>
                </thead>
                <tbody>
                  ${(state.user.labs || []).map(l => `
                    <tr class="border-b border-slate-100 last:border-b-0">
                      <td class="py-2 px-2 font-semibold text-slate-800">${esc(formatTanggalIndo(l.tanggal || l.bulan))}</td>
                      <td class="py-2 px-2 font-mono font-bold text-teal-700">${esc(l.hb)} g/dL</td>
                      <td class="py-2 px-2 font-mono text-slate-700">${Number(l.trombosit || 0).toLocaleString('id-ID')} /µL</td>
                    </tr>
                  `).join('') || '<tr><td colspan="3" class="py-3 text-center text-slate-400">Belum ada data lab</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200/80 space-y-3">
            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-700">IV. Pengobatan Rutin</h4>
            <form onsubmit="handleSaveItem(event, 'obat')" class="p-2.5 rounded-xl bg-sky-50/70 border border-sky-200 space-y-2">
              <div class="grid grid-cols-2 gap-1.5">
                <input id="obatNama" type="text" required placeholder="Nama Obat" class="px-2 py-1 rounded bg-white border border-sky-300 text-xs" />
                <input id="obatDosis" type="text" required placeholder="Dosis (mis. 1x1)" class="px-2 py-1 rounded bg-white border border-sky-300 text-xs" />
              </div>
              <input id="obatKet" type="text" placeholder="Keterangan waktu minum obat..." class="w-full px-2 py-1 rounded bg-white border border-sky-300 text-xs" />
              <button type="submit" class="w-full py-1.5 rounded-lg bg-sky-600 text-white text-[11px] font-bold">+ Tambah Obat ke Rapor</button>
            </form>
            <div class="space-y-2">
              ${(state.user.medications || []).map(m => `
                <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200/80">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-800">💊 ${esc(m.nama_obat)}</span>
                    <span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-sky-100 text-sky-800">${esc(m.dosis)}</span>
                  </div>
                  <p class="text-[11px] text-slate-500 mt-1">${esc(m.keterangan)}</p>
                </div>
              `).join('') || '<p class="text-xs text-slate-400 text-center py-3">Belum ada daftar obat.</p>'}
            </div>
          </div>
        `;
      }

      // 5. TAB CATATAN
      else {
        content = `
          <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200/80 space-y-3">
            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-700">V. Keluhan &amp; Catatan Medis</h4>
            <form onsubmit="handleSaveItem(event, 'catatan')" class="p-3 rounded-xl bg-teal-50/70 border border-teal-200 space-y-2">
              <label class="block text-[11px] font-bold text-teal-900">Catat Keluhan / Tindakan Saat HD:</label>
              <input id="catKeluhan" type="text" required placeholder="Keluhan (contoh: Kram ringan / Pusing / Tidak ada)" class="w-full px-2.5 py-1.5 rounded-lg bg-white border border-teal-300 text-xs text-slate-800" />
              <div class="grid grid-cols-2 gap-1.5">
                <input id="catTindakan" type="text" placeholder="Tindakan (opsional)" class="w-full px-2 py-1.5 rounded-lg bg-white border border-teal-300 text-xs text-slate-800" />
                <input id="catPetugas" type="text" placeholder="Nama Dokter/Perawat" class="w-full px-2 py-1.5 rounded-lg bg-white border border-teal-300 text-xs text-slate-800" />
              </div>
              <button type="submit" class="w-full py-1.5 rounded-lg bg-teal-600 hover:bg-teal-500 text-white text-[11px] font-semibold transition">+ Simpan Catatan Rapor Saya</button>
            </form>
            <div class="space-y-2.5">
              ${(state.user.notes || []).map(n => `
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200/90 space-y-1.5 text-xs">
                  <div class="flex items-center justify-between text-[10px] text-slate-400 font-semibold">
                    <span>📅 ${esc(formatTanggalIndo(n.tanggal))}</span>
                    <span class="text-teal-700">${esc(n.petugas)}</span>
                  </div>
                  <div>
                    <span class="text-[10px] text-slate-400 block">Keluhan:</span>
                    <p class="font-semibold text-slate-800">${esc(n.keluhan)}</p>
                  </div>
                  <div>
                    <span class="text-[10px] text-slate-400 block">Tindakan:</span>
                    <p class="text-slate-700">${esc(n.tindakan)}</p>
                  </div>
                </div>
              `).join('') || '<p class="text-xs text-slate-400 text-center py-4">Belum ada catatan medis.</p>'}
            </div>
          </div>
        `;
      }

      root.innerHTML = `
        <header class="bg-teal-700 text-white px-4 py-3 flex items-center justify-between shadow-sm">
          <div class="flex items-center gap-2">
            <img src="${LOGO_URI}" alt="Logo HD" class="w-7 h-7 rounded-full bg-white/15 p-0.5 object-contain" />
            <div>
              <h1 class="text-xs font-bold leading-tight">${esc(p.nama)}</h1>
              <p class="text-[10px] text-teal-100 font-mono">NIK: ${esc(p.nik)}</p>
            </div>
          </div>
          <div class="flex items-center gap-1.5">
            ${state.isAdmin ? `<button onclick="state.user=null;render()" class="px-2.5 py-1 rounded-lg bg-amber-500 text-slate-950 text-[10px] font-bold">&larr; Daftar Pasien</button>` : ''}
            <button onclick="state.user=null;state.isAdmin=false;render()" class="px-2.5 py-1 rounded-lg bg-teal-800 hover:bg-teal-900 text-[10px] font-semibold">Keluar</button>
          </div>
        </header>
        <main class="flex-1 p-3 space-y-3 overflow-y-auto">${content}</main>
        <nav class="bg-white border-t border-slate-200 grid grid-cols-4 py-1.5 px-1 text-center">
          <button onclick="state.activeTab='home';state.editingProfile=false;render()" class="flex flex-col items-center py-1 rounded-xl ${state.activeTab==='home'?'text-teal-600 font-bold':'text-slate-400'}">
            <span class="text-sm">🏠</span>
            <span class="text-[10px] mt-0.5">Info HD</span>
          </button>
          <button onclick="state.activeTab='vital';state.editingProfile=false;render()" class="flex flex-col items-center py-1 rounded-xl ${state.activeTab==='vital'?'text-teal-600 font-bold':'text-slate-400'}">
            <span class="text-sm">⚖️</span>
            <span class="text-[10px] mt-0.5">Timbang BB</span>
          </button>
          <button onclick="state.activeTab='lab';state.editingProfile=false;render()" class="flex flex-col items-center py-1 rounded-xl ${state.activeTab==='lab'?'text-teal-600 font-bold':'text-slate-400'}">
            <span class="text-sm">🧪</span>
            <span class="text-[10px] mt-0.5">Lab &amp; Obat</span>
          </button>
          <button onclick="state.activeTab='notes';state.editingProfile=false;render()" class="flex flex-col items-center py-1 rounded-xl ${state.activeTab==='notes'?'text-teal-600 font-bold':'text-slate-400'}">
            <span class="text-sm">📋</span>
            <span class="text-[10px] mt-0.5">Catatan</span>
          </button>
        </nav>
      `;
    }

    function handleLogin(e) {
      e.preventDefault();
      const nik = document.getElementById('nikInput').value.trim();
      const pass = document.getElementById('passInput').value.trim();
      if (nik.length !== 16 && nik.toUpperCase() !== 'ADMIN') {
        state.error = 'NIK harus berjumlah 16 digit angka.';
        render();
        return;
      }
      state.loading = true; state.error = ''; state.infoMsg = ''; render();
      if (isGas) {
        google.script.run
          .withSuccessHandler(res => {
            state.loading = false;
            if (res && res.isAdmin) {
              state.isAdmin = true;
              state.adminPass = pass;
              state.adminPatients = res.patients || [];
              state.user = null;
            } else {
              state.isAdmin = false;
              state.user = res;
            }
            render();
          })
          .withFailureHandler(err => { state.loading = false; state.error = err.message; render(); })
          .loginPasienByNik(nik, pass);
      }
    }

    function handleAdminAddPatient(e) {
      e.preventDefault();
      const payload = {
        nik: document.getElementById('admNewNik').value,
        password: document.getElementById('admNewPass').value,
        nama: document.getElementById('admNewNama').value
      };
      state.loading = true; state.error = ''; state.infoMsg = ''; render();
      if (isGas) {
        google.script.run
          .withSuccessHandler(res => {
            state.loading = false;
            state.adminPatients = res.patients || [];
            state.infoMsg = 'Pasien ' + payload.nama + ' berhasil didaftarkan!';
            render();
          })
          .withFailureHandler(err => { state.loading = false; state.error = err.message; render(); })
          .adminTambahPasienBaru(state.adminPass, payload);
      }
    }

    function handleAdminUpdatePatient(e, oldNik) {
      e.preventDefault();
      const payload = {
        nik: document.getElementById('editPtNik').value,
        password: document.getElementById('editPtPass').value,
        nama: document.getElementById('editPtNama').value
      };
      state.loading = true; state.error = ''; state.infoMsg = ''; render();
      if (isGas) {
        google.script.run
          .withSuccessHandler(res => {
            state.loading = false;
            state.editingPatientNik = null;
            state.adminPatients = res.patients || [];
            state.infoMsg = 'Data akun pasien berhasil diperbarui!';
            render();
          })
          .withFailureHandler(err => { state.loading = false; state.error = err.message; render(); })
          .adminUpdateAkunPasien(state.adminPass, oldNik, payload);
      }
    }

    function handleAdminViewPatient(targetNik) {
      state.loading = true; state.error = ''; render();
      if (isGas) {
        google.script.run
          .withSuccessHandler(res => {
            state.loading = false;
            state.user = res;
            state.activeTab = 'home';
            render();
          })
          .withFailureHandler(err => { state.loading = false; state.error = err.message; render(); })
          .adminLihatRaporPasien(state.adminPass, targetNik);
      }
    }

    function handleSaveProfile(e) {
      e.preventDefault();
      const checkedDays = [];
      document.querySelectorAll('.p-jadwal-cb:checked').forEach(cb => checkedDays.push(cb.value));
      const payload = {
        no_rm: document.getElementById('pNoRm').value,
        tgl_lahir: dmyToIso(document.getElementById('pLahir').value),
        jk: document.getElementById('pJk').value,
        gol_darah: document.getElementById('pGol').value,
        jadwal_hd: checkedDays.join(', '),
        akses_vaskular: document.getElementById('pAkses').value,
        bb_kering: document.getElementById('pBbKering').value,
        catatan_umum: document.getElementById('pCatatanUmum') ? document.getElementById('pCatatanUmum').value : ''
      };
      if (isGas) {
        google.script.run.withSuccessHandler(res => {
          state.user = res;
          state.editingProfile = false;
          render();
        }).simpanProfilMandiri(state.user.profile.nik, payload);
      }
    }

    function handleSaveVital(e) {
      e.preventDefault();
      const payload = {
        tanggal: dmyToIso(document.getElementById('vTgl').value),
        bb_pre: document.getElementById('vPre').value,
        bb_post: document.getElementById('vPost').value,
        td_pre: document.getElementById('tdPre').value,
        td_post: document.getElementById('tdPost').value,
        uf_liter: document.getElementById('vUf').value,
        durasi_jam: document.getElementById('vDurasi').value
      };
      if (isGas) {
        google.script.run.withSuccessHandler(res => { state.user = res; render(); }).simpanVitalMandiri(state.user.profile.nik, payload);
      }
    }

    function handleSaveItem(e, jenis) {
      e.preventDefault();
      let payload = {};
      if (jenis === 'lab') {
        payload = { tanggal: dmyToIso(document.getElementById('labBulan').value), hb: document.getElementById('labHb').value, trombosit: document.getElementById('labAt').value };
      } else if (jenis === 'obat') {
        payload = { nama_obat: document.getElementById('obatNama').value, dosis: document.getElementById('obatDosis').value, keterangan: document.getElementById('obatKet').value };
      } else {
        payload = {
          keluhan: document.getElementById('catKeluhan').value,
          tindakan: document.getElementById('catTindakan').value,
          petugas: document.getElementById('catPetugas') ? document.getElementById('catPetugas').value : 'Pasien Mandiri'
        };
      }
      if (isGas) {
        google.script.run.withSuccessHandler(res => { state.user = res; render(); }).simpanItemRaporMandiri(state.user.profile.nik, jenis, payload);
      }
    }

    render();
  </script>
</body>
</html>
