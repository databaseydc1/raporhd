    const AKSES_ALL = ['Fistula AV', 'Graft AV', 'Kateter'];

    const HARI_INDO = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

    function esc(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function isoToDmy(dateStr) {
      if (!dateStr) return '';
      const clean = String(dateStr).trim();
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(clean)) return clean;
      const p = clean.split('-');
      if (p.length === 3 && p[0].length === 4) {
        return p[2].padStart(2, '0') + '/' + p[1].padStart(2, '0') + '/' + p[0];
      }
      return clean;
    }

    function dmyToIso(dateStr) {
      if (!dateStr) return '';
      const clean = String(dateStr).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(clean)) return clean;
      const p = clean.split('/');
      if (p.length === 3 && p[2].length === 4) {
        return p[2] + '-' + p[1].padStart(2, '0') + '-' + p[0].padStart(2, '0');
      }
      return clean;
    }

    function todayDmy() {
      const d = new Date();
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return dd + '/' + mm + '/' + yyyy;
    }

    window.maskDmy = function(el, previewId) {
      let v = el.value.replace(/[^0-9]/g, '').slice(0, 8);
      if (v.length >= 5) {
        el.value = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
      } else if (v.length >= 3) {
        el.value = v.slice(0, 2) + '/' + v.slice(2);
      } else {
        el.value = v;
      }
      if (previewId) {
        const prev = document.getElementById(previewId);
        if (prev) prev.textContent = '📅 ' + formatTanggalIndo(el.value);
      }
    };

    function formatTanggalIndo(dateStr) {
      if (!dateStr) return '-';
      const iso = dmyToIso(dateStr);
      const parts = String(iso).trim().split('-');
      if (parts.length === 3 && parts[0].length === 4) {
        const y = Number(parts[0]);
        const m = Number(parts[1]) - 1;
        const d = Number(parts[2]);
        const dt = new Date(y, m, d);
        if (!isNaN(dt.getTime())) {
          const dd = String(d).padStart(2, '0');
          const mm = String(m + 1).padStart(2, '0');
          return HARI_INDO[dt.getDay()] + ', ' + dd + '/' + mm + '/' + y;
        }
      }
      return dateStr;
    }

    function parseJadwalArray(val) {
      if (Array.isArray(val)) return val;
      if (!val) return [];
      return String(val).split(',').map(s => s.trim()).filter(Boolean);
    }

    function computeStats(vitals) {
      const sorted = (vitals || []).slice().sort((a, b) => String(dmyToIso(a.tanggal)).localeCompare(String(dmyToIso(b.tanggal))));
      const enriched = sorted.map((v, i) => {
        const pre = Number(v.bb_pre) || 0;
        const post = v.bb_post !== '' && v.bb_post !== null && v.bb_post !== undefined ? Number(v.bb_post) : null;
        const drop = (post !== null && pre > 0) ? Number((pre - post).toFixed(2)) : null;
        const prev = i > 0 ? sorted[i - 1] : null;
        const prevPost = prev && prev.bb_post !== '' && prev.bb_post !== null ? Number(prev.bb_post) : null;
        const idwg = (prevPost !== null && pre > 0) ? Number((pre - prevPost).toFixed(2)) : null;
        return Object.assign({}, v, { drop, idwg });
      });

      const latestMs = enriched.length ? new Date(dmyToIso(enriched[enriched.length - 1].tanggal)).getTime() : Date.now();
      const monthRows = enriched.filter(x => {
        const ms = new Date(dmyToIso(x.tanggal)).getTime();
        return !isNaN(ms) ? (latestMs - ms) <= (30 * 86400000) : true;
      });

      const validDrops = monthRows.filter(x => x.drop !== null);
      const avgDrop1M = validDrops.length ? (validDrops.reduce((s, x) => s + x.drop, 0) / validDrops.length).toFixed(2) : '0.00';

      const validIdwg = monthRows.filter(x => x.idwg !== null);
      const avgIdwg1M = validIdwg.length ? (validIdwg.reduce((s, x) => s + x.idwg, 0) / validIdwg.length).toFixed(2) : '0.00';

      return {
        reversed: enriched.slice().reverse(),
        latest: enriched.length ? enriched[enriched.length - 1] : null,
        avgDrop1M,
        avgIdwg1M,
        monthCount: monthRows.length
      };
    }
